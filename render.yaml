services:
  - type: web
    name: nlc-backend
    runtime: docker
    rootDir: backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DB_URL
        value: jdbc:postgresql://postgres:5432/nlc_db
      - key: DB_USERNAME
        fromDatabase:
          name: nlc-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nlc-postgres
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "2"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLIC_BUCKET
        value: nlc-public
      - key: SUPABASE_PRIVATE_BUCKET
        value: nlc-private
      - key: SUPABASE_SIGNED_URL_TTL
        value: "300"
      - key: APP_STORAGE_PROVIDER
        value: SUPABASE
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: BOOKING_EMAIL_ENABLED
        value: "false"
      - key: INSTAGRAM_SYNC_ENABLED
        value: "false"
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_API_BASE_URL
        value: https://graph.facebook.com/v23.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "91"
      - key: WHATSAPP_ADMIN_RECIPIENT_NUMBER
        sync: false
databases:
  - name: nlc-postgres
    plan: starter
