spring:
  application:
    name: event-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nlc_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      # Sensible HikariCP pool sizing for Supabase Postgres.
      # Supabase free tier caps concurrent connections — keep this conservative.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: nlc-hikari
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:${PORT:8080}}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:SUPABASE}
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      public-bucket: ${SUPABASE_PUBLIC_BUCKET:nlc-public}
      private-bucket: ${SUPABASE_PRIVATE_BUCKET:nlc-private}
      signed-url-ttl-seconds: ${SUPABASE_SIGNED_URL_TTL:300}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      base-folder: ${CLOUDINARY_BASE_FOLDER:nlc}
      gallery-folder: ${CLOUDINARY_GALLERY_FOLDER:nlc/gallery}
      events-folder: ${CLOUDINARY_EVENTS_FOLDER:nlc/events}
      members-folder: ${CLOUDINARY_MEMBERS_FOLDER:nlc/members}
      sponsors-folder: ${CLOUDINARY_SPONSORS_FOLDER:nlc/sponsors}
      max-bytes: ${CLOUDINARY_MAX_BYTES:10485760}
  security:
    jwt:
      issuer: nlc-event-management
      access-token-secret: ${JWT_ACCESS_SECRET:please-change-this-access-secret-for-production}
      refresh-token-secret: ${JWT_REFRESH_SECRET:please-change-this-refresh-secret-for-production}
      access-token-expiration-minutes: 30
      refresh-token-expiration-days: 14
    cors:
      allowed-origins:
        - ${FRONTEND_BASE_URL:http://localhost:5173}
        - http://localhost:3000
  integrations:
    instagram:
      enabled: ${INSTAGRAM_SYNC_ENABLED:false}
      access-token: ${INSTAGRAM_ACCESS_TOKEN:}
      user-id: ${INSTAGRAM_USER_ID:}
      api-base-url: https://graph.instagram.com
      sync-cron: ${INSTAGRAM_SYNC_CRON:0 0 */6 * * *}
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:false}
      api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v23.0}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
      admin-recipient-number: ${WHATSAPP_ADMIN_RECIPIENT_NUMBER:}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  notifications:
    booking-email-enabled: ${BOOKING_EMAIL_ENABLED:true}
  membership:
    fee: ${MEMBERSHIP_FEE:500}
    upi-id: ${MEMBERSHIP_UPI_ID:nlcpayment@upi}
    qr-image-url: ${MEMBERSHIP_QR_IMAGE_URL:}
    payment-instructions: ${MEMBERSHIP_PAYMENT_INSTRUCTIONS:Pay the membership fee using the QR code or UPI ID, then upload a screenshot of the successful payment below. Your application will be reviewed by an admin and you will be notified once approved.}
    enabled: ${MEMBERSHIP_REGISTRATION_ENABLED:true}
logging:
  level:
    com.nlc.backend: INFO
